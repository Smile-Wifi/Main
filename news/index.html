<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📰 Smile News</title>
  <link rel="stylesheet" href="css/style.css" />

  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      color: #222;
      transition: background 0.3s, color 0.3s;
    }
    body.dark {
      background: #121212;
      color: #f5f5f5;
    }
    header {
      text-align: center;
      padding: 20px;
      background: #fff;
      color: #222;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    body.dark header {
      background: #1f1f1f;
      color: #fff;
      box-shadow: 0 2px 5px rgba(255,255,255,0.1);
    }
    main {
      max-width: 700px;
      margin: 20px auto;
      padding: 10px;
    }
    .news-item {
      background: #fff;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      transition: transform 0.2s;
    }
    .news-item:hover {
      transform: translateY(-3px);
    }
    body.dark .news-item {
      background: #1e1e1e;
      box-shadow: 0 2px 6px rgba(255,255,255,0.1);
    }
    img, video {
      width: 100%;
      border-radius: 10px;
      margin-top: 10px;
    }
    small {
      color: gray;
      display: block;
      margin-top: 5px;
    }
    .toggle-btn {
      position: fixed;
      top: 10px;
      right: 10px;
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #222;
      color: #fff;
    }
    body.dark .toggle-btn {
      background: #fff;
      color: #222;
    }
  </style>
</head>
<body>
  <button class="toggle-btn" id="theme-toggle">🌙 Dark</button>

  <header>
    <h1>📰 Smile News</h1>
  </header>

  <main id="news-container">
    <p>Loading latest news...</p>
  </main>

  <script>
    // 🔄 Fetch news posts from GitHub JSON
   const NEWS_URL = "https://raw.githubusercontent.com/Smile-Wifi/Main/main/data/news.json";
    const container = document.getElementById("news-container");

    async function loadNews() {
      try {
        const res = await fetch(NEWS_URL + "?_=" + Date.now()); // prevent cache
        if (!res.ok) throw new Error("Failed to load news.json");
        const news = await res.json();

        container.innerHTML = "";
        if (!news.length) {
          container.innerHTML = "<p>No news available yet.</p>";
          return;
        }

        news.forEach(item => {
          const div = document.createElement("div");
          div.className = "news-item";

          let mediaHTML = "";
          if (item.mediaUrl) {
            if (item.mediaUrl.match(/\.(mp4|webm|ogg)$/i)) {
              mediaHTML = `<video controls src="${item.mediaUrl}"></video>`;
            } else {
              mediaHTML = `<img src="${item.mediaUrl}" alt="${item.title}">`;
            }
          }

          div.innerHTML = `
            <h2>${item.title}</h2>
            <p>${item.content}</p>
            ${mediaHTML}
            <small>${new Date(item.date).toLocaleString()}</small>
          `;
          container.appendChild(div);
        });
      } catch (err) {
        console.error("❌ Error loading news:", err);
        container.innerHTML = `<p style="color:red;">Error loading news: ${err.message}</p>`;
      }
    }

    // 🌙 Dark Mode Toggle
    const toggleBtn = document.getElementById("theme-toggle");
    toggleBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      toggleBtn.textContent = document.body.classList.contains("dark")
        ? "☀️ Light"
        : "🌙 Dark";
    });

    // 🚀 Load on start + auto refresh every minute
    loadNews();
    setInterval(loadNews, 60000);
  </script>
</body>
</html>
