<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Smile News</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .login-box {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    button {
      background: #0078ff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover {
      background: #005bd1;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>🔑 Login to Smile News Admin</h2>
    <p>Please log in to manage posts.</p>
    <button id="login">Login with Netlify</button>
  </div>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    const loginBtn = document.getElementById("login");

    loginBtn.addEventListener("click", () => {
      netlifyIdentity.open("login");
    });

    netlifyIdentity.on("login", (user) => {
      console.log("Logged in as", user.email);
      window.location.href = "/admin.html";
    });
  </script>
</body>
</html>
