<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>HDO — Smileflix (Auto GitHub MP4)</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0b; --panel:rgba(16,16,16,0.75); --muted:#9aa3ad; --accent:#ff6b00; --glass: rgba(255,255,255,0.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:linear-gradient(180deg,#050505 0%, #0b0b0b 100%);color:#fff;font-family:"Inter",system-ui,Segoe UI,Roboto,Arial,sans-serif;}
a{color:inherit;text-decoration:none}
.app{min-height:100vh;padding-bottom:76px;}
.header{display:flex;align-items:center;justify-content:space-between;padding:18px 16px;position:sticky;top:0;z-index:30;background: linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0.15));backdrop-filter: blur(6px);}
.brand{display:flex;align-items:center;gap:10px;}
.logo-badge{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#ff7f2a,#ff4d00);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:18px;box-shadow:0 6px 18px rgba(255,107,0,0.12);}
.brand .title{display:flex;flex-direction:column;line-height:1;}
.brand h1{font-size:16px;font-weight:700}
.brand span{font-size:11px;color:var(--muted);margin-top:2px}
.header-controls{display:flex;gap:12px;align-items:center}
.icon-btn{width:38px;height:38px;border-radius:10px;background:var(--glass);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,0.6);}
.icon-btn svg{width:18px;height:18px;color:#fff;opacity:0.95}
.tabs{display:flex;gap:8px;padding:12px 12px 6px;overflow:auto}
.tab{padding:8px 14px;border-radius:999px;background:transparent;color:var(--muted);font-weight:600;font-size:13px;border:1px solid transparent;cursor:pointer;white-space:nowrap;}
.tab.active{background:linear-gradient(90deg, rgba(255,107,0,0.12), rgba(255,107,0,0.06));color:var(--accent);box-shadow:0 8px 22px rgba(255,107,0,0.06);border-color:rgba(255,107,0,0.08)}
.player-wrap{padding:14px}
.player-card{border-radius:16px;overflow:hidden;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));box-shadow: 0 14px 40px rgba(2,6,23,0.6);padding:0.5rem;}
#mainPlayer{width:100%;height:220px;border-radius:12px;background:#000;display:block;object-fit:cover}
.section{padding:14px 14px 4px;display:flex;align-items:center;justify-content:space-between}
.section h2{font-size:16px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));gap:12px;padding:12px}
.card{position:relative;border-radius:12px;overflow:hidden;background:var(--glass);transition:transform .28s ease, box-shadow .28s ease;cursor:pointer}
.card:hover{transform:translateY(-6px);box-shadow:0 20px 40px rgba(0,0,0,0.6)}
.card video{width:100%;height:190px;object-fit:cover;display:block;background:#000}
.card .meta{position:absolute;left:10px;right:10px;bottom:10px;color:#fff;display:flex;align-items:center;justify-content:space-between}
.card .meta .title{font-size:13px;font-weight:700;text-shadow:0 4px 12px rgba(0,0,0,0.6)}
.card .meta .badge{background:linear-gradient(90deg,#ff8a3b,#ff5a00);padding:6px 8px;border-radius:8px;font-size:12px;font-weight:700;color:#fff}
.card.active{outline:3px solid rgba(255,107,0,0.16);box-shadow:0 26px 50px rgba(255,107,0,0.06)}
.bottom-nav{position:fixed;left:0;right:0;bottom:10px;margin:0 auto;max-width:760px;display:flex;gap:6px;justify-content:space-between;padding:10px 12px;background:linear-gradient(180deg, rgba(10,10,10,0.95), rgba(5,5,5,0.9));border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,0.6);z-index:50;margin-left:12px;margin-right:12px;}
.nav-item{flex:1;text-align:center;padding:8px 6px;border-radius:12px;color:var(--muted);font-weight:700;font-size:13px}
.nav-item.active{color:var(--accent);background:linear-gradient(90deg, rgba(255,107,0,0.06), rgba(255,107,0,0.03));box-shadow:0 8px 20px rgba(255,107,0,0.04)}
@media(min-width:900px){#mainPlayer{height:380px}.card video{height:220px}}@media(max-width:420px){#mainPlayer{height:200px}.card video{height:160px}.grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}}
.small-muted{font-size:12px;color:var(--muted);padding:8px 12px}
.warn{padding:8px 12px;color:#ffd7b5;background:rgba(255,107,0,0.06);border-radius:8px;margin:12px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">

  <header class="header">
    <div class="brand">
      <div class="logo-badge">20</div>
      <div class="title"><h1>Smile Flex</h1><span>Auto GitHub MP4 • Offline-ready</span></div>
    </div>
    <div class="header-controls">
      <div class="icon-btn" title="Search" onclick="document.getElementById('searchInput').focus()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 21l-4.35-4.35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="11" cy="11" r="6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
  </header>

  <div class="tabs" role="tablist" aria-label="Categories">
    <button class="tab active" data-tab="home">Home</button>
    <button class="tab" data-tab="movie">Movie</button>
    <button class="tab" data-tab="tvshow">TVshow</button>
    <input id="searchInput" type="search" placeholder="Search videos..." style="margin-left:12px;background:transparent;border:none;color:#fff;outline:none;font-size:13px" />
  </div>

  <div class="player-wrap">
    <div class="player-card">
      <video id="mainPlayer" controls preload="metadata">
        <source src="" type="video/mp4">
        Your browser doesn't support HTML5 video.
      </video>
    </div>
  </div>

  <!-- HOME TAB -->
  <div id="homeTab">
    <section class="section">
      <h2>Recommended (auto from GitHub)</h2>
      <a href="#" id="refreshBtn" title="Refresh list">Refresh</a>
    </section>
    <div class="small-muted">Source: <strong>Smile-Wifi/smileflex</strong> (public GitHub repo).</div>
    <div class="warn">Videos cache after play — large files may not all store offline.</div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- TV SHOW TAB -->
  <div id="tvTab" class="hidden">
    <section class="section">
      <h2>TV Shows</h2>
    </section>
    <div class="grid" id="tvGrid"></div>
  </div>

</div>

<nav class="bottom-nav" role="navigation" aria-label="Bottom Navigation">
  <a class="nav-item active" href="#">🏠 Home</a>
  <a class="nav-item" href="#">🎬 Movies</a>
  <a class="nav-item" href="#">📺 TV Shows</a>
  <a class="nav-item" href="#">⭐ Watchlist</a>
</nav>

<script>
const GITHUB_OWNER='Smile-Wifi',GITHUB_REPO='smileflex',GITHUB_BRANCH='main';
const grid=document.getElementById('grid');
const player=document.getElementById('mainPlayer');
const searchInput=document.getElementById('searchInput');
const refreshBtn=document.getElementById('refreshBtn');
const tvGrid=document.getElementById('tvGrid');

function rawUrlFor(path){
  return `https://raw.githubusercontent.com/${encodeURIComponent(GITHUB_OWNER)}/${encodeURIComponent(GITHUB_REPO)}/${encodeURIComponent(GITHUB_BRANCH)}/${encodeURIComponent(path)}`;
}

/* === GitHub Auto Loader === */
async function fetchRepoFiles(){
  grid.innerHTML='<div class="small-muted" style="padding:12px">Loading file list…</div>';
  try{
    const api=`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents`;
    const res=await fetch(api,{headers:{'Accept':'application/vnd.github.v3+json'}});
    if(!res.ok)throw new Error('GitHub API error: '+res.status);
    const items=await res.json();
    const mp4=items.filter(i=>i.type==='file' && /\.mp4$/i.test(i.name));
    if(mp4.length===0){grid.innerHTML='<p style="padding:12px;color:var(--muted)">No .mp4 found.</p>';return;}
    grid.innerHTML='';
    mp4.forEach(item=>{
      const src=rawUrlFor(item.name);
      createCard(item.name.replace(/\.mp4$/i,''),src,grid);
    });
  }catch(err){
    grid.innerHTML=`<p style="padding:12px;color:var(--muted)">Error: ${err.message}</p>`;
  }
}

/* === Static TV Shows === */
const tvShows=[
  "http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
  "http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",
  "http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
  "http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
  "http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4",
  "http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4",
  "http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4",
  "http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4",
  "http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/SubaruOutbackOnStreetAndDirt.mp4",
  "http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4",
  "http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/WeAreGoingOnBullrun.mp4",
  "http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/WhatCarCanYouGetForAGrand.mp4"
];
tvShows.forEach(url=>{
  const title=url.split('/').pop().replace(/\.mp4$/i,'');
  createCard(title,url,tvGrid);
});

function createCard(title,src,target){
  const card=document.createElement('div');
  card.className='card playlist-item';
  card.dataset.name=title.toLowerCase();
  const vid=document.createElement('video');
  vid.src=src;vid.muted=true;vid.playsInline=true;vid.preload='metadata';
  card.appendChild(vid);
  const meta=document.createElement('div');
  meta.className='meta';
  meta.innerHTML=`<div class="title">${title}</div><div class="badge">HD</div>`;
  card.appendChild(meta);
  card.addEventListener('click',()=>playVideoInMain(src,card));
  card.addEventListener('mouseenter',()=>{vid.play().catch(()=>{});vid.loop=true;});
  card.addEventListener('mouseleave',()=>{vid.pause();vid.currentTime=0;});
  target.appendChild(card);
}

function playVideoInMain(src,el){
  player.src=src;player.play().catch(()=>{});
  document.querySelectorAll('.playlist-item').forEach(i=>i.classList.remove('active'));
  el.classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

/* Search Filter */
searchInput.addEventListener('input',()=>{
  const q=(searchInput.value||'').trim().toLowerCase();
  document.querySelectorAll('.card').forEach(c=>{
    const name=c.dataset.name||'';
    c.style.display=(!q||name.includes(q))?'':'none';
  });
});

/* Tabs switch */
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    const show=tab.dataset.tab;
    document.getElementById('homeTab').classList.toggle('hidden',show!=='home');
    document.getElementById('tvTab').classList.toggle('hidden',show!=='tvshow');
  });
});

/* Refresh */
refreshBtn.addEventListener('click',e=>{e.preventDefault();fetchRepoFiles();});

/* SW register */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(console.warn);
}

/* Init */
fetchRepoFiles();
</script>
</body>
</html>
