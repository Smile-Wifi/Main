<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chrome Browser Clone</title>
<style>
  :root {
    --bg-color: #ffffff;
    --text-color: #000000;
    --header-bg: #eee;
    --btn-bg: #4285F4;
    --icon-bg: #f0f0f0;
  }

  body.dark {
    --bg-color: #1e1e1e;
    --text-color: #f5f5f5;
    --header-bg: #2c2c2c;
    --btn-bg: #4285F4;
    --icon-bg: #2a2a2a;
  }

  * {
    box-sizing: border-box;
  }

  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, sans-serif;
    background: var(--bg-color);
    color: var(--text-color);
  }

  .browser-window {
    max-width: 800px;
    margin: 20px auto;
    border: 2px solid #ccc;
    border-radius: 10px;
    background: var(--bg-color);
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 90vh;
  }

  .browser-header {
    background: var(--header-bg);
    padding: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: space-between;
  }

  .chrome-buttons {
    display: flex;
    gap: 6px;
  }

  .chrome-buttons div {
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }

  .close { background: #f25f5c; }
  .minimize { background: #ffbe40; }
  .maximize { background: #0acf83; }

  .theme-toggle {
    cursor: pointer;
    padding: 5px 10px;
    background: var(--btn-bg);
    color: #fff;
    border-radius: 5px;
    border: none;
  }

  .browser-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .search-bar {
    width: 80%;
    max-width: 400px;
    padding: 10px;
    border-radius: 25px;
    border: 1px solid #ccc;
    font-size: 16px;
    margin-bottom: 10px;
  }

  .search-btn {
    padding: 10px 20px;
    border-radius: 25px;
    border: none;
    background: var(--btn-bg);
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    margin-bottom: 20px;
  }

  .icon-grid {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 20px;
  }

  .icon-grid a {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: var(--text-color);
    font-size: 14px;
  }

  .icon-grid img {
    width: 50px;
    height: 50px;
    background: var(--icon-bg);
    border-radius: 10px;
    padding: 10px;
  }

  #bookmarks {
    margin-top: 20px;
    width: 90%;
    max-width: 600px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }

  #bookmarks a {
    padding: 6px 12px;
    background: var(--icon-bg);
    border-radius: 8px;
    text-decoration: none;
    color: var(--text-color);
    font-size: 14px;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: none;
  }

  @media(max-width: 500px) {
    .search-bar { width: 70%; }
    .icon-grid img { width: 40px; height: 40px; padding: 5px; }
  }
</style>
</head>
<body>

<div class="browser-window">
  <div class="browser-header">
    <div class="chrome-buttons">
      <div class="close"></div>
      <div class="minimize"></div>
      <div class="maximize"></div>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()">Toggle Dark</button>
  </div>

  <div class="browser-body" id="browserBody">
    <input type="text" class="search-bar" id="searchInput" placeholder="Enter URL or search Google...">
    <button class="search-btn" onclick="openURL()">Go</button>

    <!-- Icon grid -->
    <div class="icon-grid">
      <a href="https://www.google.com" target="_blank">
        <img src="https://www.google.com/favicon.ico" alt="Google">
        <span>Google</span>
      </a>
      <a href="https://www.youtube.com" target="_blank">
        <img src="https://www.youtube.com/s/desktop/11de5f3d/img/favicon_32x32.png" alt="YouTube">
        <span>YouTube</span>
      </a>
      <a href="https://github.com" target="_blank">
        <img src="https://github.githubassets.com/favicons/favicon.png" alt="GitHub">
        <span>GitHub</span>
      </a>
    </div>

    <!-- Bookmarks -->
    <div id="bookmarks"></div>
  </div>

  <iframe id="browserFrame"></iframe>
</div>

<script>
// Dark theme toggle
function toggleTheme() {
  document.body.classList.toggle('dark');
}

// Open URL or search
function openURL() {
  const input = document.getElementById('searchInput').value.trim();
  const iframe = document.getElementById('browserFrame');
  const body = document.getElementById('browserBody');

  if (!input) return;

  let url = input;

  // If input doesn't start with http/https, treat as Google search
  if (!/^https?:\/\//i.test(input)) {
    url = `https://www.google.com/search?q=${encodeURIComponent(input)}`;
  }

  iframe.src = url;
  iframe.style.display = 'block';
  body.style.display = 'none';

  // Save as bookmark
  addBookmark(input);
}

// Allow Enter key
document.getElementById('searchInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') openURL();
});

// Bookmark functionality
function addBookmark(url) {
  const bookmarks = document.getElementById('bookmarks');
  const link = document.createElement('a');
  link.href = url.startsWith('http') ? url : `https://www.google.com/search?q=${encodeURIComponent(url)}`;
  link.target = "_blank";
  link.textContent = url;
  bookmarks.appendChild(link);
}
</script>

</body>
</html>
