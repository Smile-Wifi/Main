<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale1">
  <meta http-equiv="Cache-Control" content="public, max-age=3600">
  <meta name="theme-color" content="#0d6efd">
  <title>Smile Wifi Sports</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#111;color:#fff;font-family:system-ui;overflow-x:hidden}
    header{background:#0d6efd;padding:1rem;text-align:center;position:sticky;top:0;z-index:10}
    .reel{position:relative;width:100%;padding-bottom:100%;background:#000}
    .reel iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
    @media(min-width:768px){.reel{padding-bottom:56.25%}}
    .info{background:#222;margin:1rem;padding:1rem;border-radius:12px}
    .gallery{margin:1.5rem 1rem;overflow:hidden}
    .swiper{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 0;
            -webkit-overflow-scrolling:touch;scrollbar-width:none}
    .swiper::-webkit-scrollbar{display:none}
    .slide{flex:0 0 85%;scroll-snap-align:start;background:#000;border-radius:12px;
           overflow:hidden;box-shadow:0 6px 20px #0008}
    .slide iframe{width:100%;height:180px;border:0}
    .caption{padding:0.6rem 0.8rem;background:#1a1a1a;font-size:0.9rem}
    .loader{text-align:center;padding:2rem;color:#0d6efd}

    /* ANIMATED FOOTER */
    .footer-nav{
      position:fixed;bottom:0;left:0;right:0;
      background:rgba(0,0,0,0.9);backdrop-filter:blur(10px);
      padding:12px 0;display:flex;justify-content:space-around;
      border-top:1px solid #333;z-index:999;
    }
    .footer-nav a{opacity:0.9;transform:scale(0.95)}
    .footer-nav a:hover{opacity:1;transform:scale(1.1)}
    .footer-nav img{width:44px;height:44px;object-fit:contain}
    .footer-nav a:active{transform:scale(0.9)}
  </style>
</head>
<body>

<header>
  <h1>Sports Reels</h1>
  <p>Smile Wifi</p>
</header>

<div class="reel">
  <iframe src="https://www.facebook.com/plugins/video.php?href=https%3A%2F%2Fwww.facebook.com%2Freel%2F1134015738834742&show_text=false&autoplay=1"
          allow="autoplay; fullscreen" allowfullscreen></iframe>
</div>

<div class="info">
  <strong>Now Playing:</strong> Epic Goal Highlights
</div>

<div class="gallery">
  <h3 style="padding:0 1rem .5rem;color:#0d6efd">More Reels</h3>
  <div class="swiper" id="swiper"></div>
  <div class="loader" id="loader">Loading more…</div>
</div>

<!-- YOUR ANIMATED FOOTER -->
<div class="footer-nav">
  <a href="earth.html"><img src="GIF/earth.gif" alt="Earth"></a>
  <a href="https://smile-wifi.github.io/Main"><img src="GIF/Home.png" alt="Home"></a>
  <a href="mars.html"><img src="GIF/mars.gif" alt="Mars"></a>
</div>

<script>
  const reelURLs = [
    "https://www.facebook.com/61575993354019/videos/1333021481876788",
    "https://www.facebook.com/reel/687837200652832",
    "https://www.facebook.com/clayford.odchimar/videos/847658861024072",
    "https://www.facebook.com/victoriacaralde/videos/566385062470947",
    "https://www.facebook.com/reel/223344556677889",
    "https://www.facebook.com/reel/334455667788990",
    "https://www.facebook.com/reel/445566778899001",
    "https://www.facebook.com/reel/556677889900112",
    "https://www.facebook.com/reel/667788990011223",
    "https://www.facebook.com/reel/778899001122334",
    "https://www.facebook.com/reel/889900112233445",
    "https://www.facebook.com/reel/990011223344556",
    "https://www.facebook.com/reel/101112233445566",
    "https://www.facebook.com/reel/212223344556677",
    "https://www.facebook.com/reel/323334455667788",
    "https://www.facebook.com/reel/434445566778899",
    "https://www.facebook.com/reel/545556677889900",
    "https://www.facebook.com/reel/656667788990011",
    "https://www.facebook.com/reel/767778899001122",
    "https://www.facebook.com/reel/878889900112233"
  ];

  const swiper = document.getElementById('swiper');
  const loader = document.getElementById('loader');
  let page = 0;

  function encode(url){
    return `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(url)}&show_text=false`;
  }

  function createSlide(url,i){
    const s=document.createElement('div'); s.className='slide';
    s.innerHTML=`<iframe src="${encode(url)}" allow="autoplay; fullscreen" allowfullscreen></iframe>
                 <div class="caption">Reel #${i+1}</div>`;
    return s;
  }

  function loadMore(){
    loader.style.display='block';
    setTimeout(()=>{
      const batch=reelURLs.slice(page*8,page*8+8);
      batch.forEach((u,i)=>swiper.appendChild(createSlide(u,page*8+i)));
      page++;
      loader.style.display=page*8>=reelURLs.length?'none':'block';
    },600);
  }

  new IntersectionObserver(e=>{if(e[0].isIntersecting)loadMore();},{rootMargin:"100px"})
      .observe(loader);
  loadMore();

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
</script>
</body>
</html>
