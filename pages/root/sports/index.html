<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sports Event Video Player</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000"/>
  <link rel="icon" href="icon-192.png"/>
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#000;color:#fff;overflow-x:hidden}
    header{display:flex;align-items:center;background:#111;padding:10px;position:sticky;top:0;z-index:100}
    .menu-btn{font-size:24px;cursor:pointer;margin-right:10px}
    .side-panel{position:fixed;top:0;left:-250px;width:250px;height:100%;background:#111;transition:left .3s ease;padding-top:60px;z-index:1000;box-shadow:2px 0 10px rgba(0,0,0,.5)}
    .side-panel.open{left:0}
    .side-panel a{display:block;color:#fff;padding:15px 20px;text-decoration:none;font-size:16px}
    .side-panel a:hover{background:#222}
    .player-container{position:relative;width:100%;max-width:800px;margin:20px auto;aspect-ratio:16/9;background:#111;border-radius:12px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.5)}
    #player{width:100%;height:100%}
    .poster{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;z-index:1}
    .spinner{position:absolute;top:50%;left:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border:5px solid #333;border-top:5px solid #ff4500;border-radius:50%;animation:spin 1s linear infinite;z-index:2;display:none}
    @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    .playlist{display:flex;overflow-x:auto;gap:12px;padding:15px;scroll-behavior:smooth;scrollbar-width:thin}
    .playlist::-webkit-scrollbar{height:6px}
    .playlist::-webkit-scrollbar-track{background:#111}
    .playlist::-webkit-scrollbar-thumb{background:#444;border-radius:3px}
    .playlist-item{flex:0 0 auto;width:160px;cursor:pointer;border-radius:10px;overflow:hidden;background:#222;text-align:center;transition:transform .2s,opacity .3s;opacity:.7}
    .playlist-item:hover{transform:scale(1.05)}
    .playlist-item.active{opacity:1;box-shadow:0 0 0 3px #ff4500}
    .playlist-item img{width:100%;height:90px;object-fit:cover}
    .playlist-item p{margin:8px 5px;font-size:13px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .loaded .poster,.loaded .spinner{display:none!important}
  </style>
</head>
<body>

<header>
  <span class="menu-btn" onclick="toggleMenu()">Menu</span>
  <h2>Sports Event Videos</h2>
</header>

<div class="side-panel" id="sidePanel">
  <a href="#">Home</a>
  <a href="#">Highlights</a>
  <a href="#">Live Games</a>
  <a href="#">About</a>
</div>

<div class="player-container" id="playerContainer">
  <img src="https://i.imgur.com/LsJX8sK.jpg" alt="Poster" class="poster" id="poster">
  <div class="spinner" id="spinner"></div>
  <div id="player"></div>
</div>

<div class="playlist" id="playlist">
  <div class="playlist-item" data-video="https://www.youtube.com/watch?v=-wtIMTCHWuI">
    <img src="https://img.youtube.com/vi/-wtIMTCHWuI/hqdefault.jpg" alt="Video 1">
    <p>Video 1</p>
  </div>
  <div class="playlist-item" data-video="https://www.youtube.com/watch?v=lalOy8Mbfdc">
    <img src="https://img.youtube.com/vi/lalOy8Mbfdc/hqdefault.jpg" alt="Video 2">
    <p>Video 2</p>
  </div>
  <div class="playlist-item" data-video="https://youtu.be/yZv2daTWRZU">
    <img src="https://img.youtube.com/vi/yZv2daTWRZU/hqdefault.jpg" alt="Short 1">
    <p>Short 1</p>
  </div>
  <div class="playlist-item" data-video="https://www.youtube.com/shorts/j9rZxAF3C0I">
    <img src="https://img.youtube.com/vi/j9rZxAF3C0I/maxresdefault.jpg" alt="Short 2">
    <p>Short 2</p>
  </div>
  <div class="playlist-item" data-video="https://www.youtube.com/live/8hBmepWUJoc">
    <img src="https://img.youtube.com/vi/8hBmepWUJoc/hqdefault.jpg" alt="Live Stream">
    <p>Live Stream</p>
  </div>
  <div class="playlist-item" data-video="https://www.youtube.com/embed/dQw4w9WgXcQ">
    <img src="https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg" alt="Rick Roll">
    <p>Rick Roll</p>
  </div>
  <div class="playlist-item" data-video="https://www.youtube-nocookie.com/embed/lalOy8Mbfdc">
    <img src="https://img.youtube.com/vi/lalOy8Mbfdc/hqdefault.jpg" alt="No Cookie">
    <p>No Cookie Embed</p>
  </div>
  <div class="playlist-item" data-video="https://www.youtube.com/v/0zM3nApSvMg">
    <img src="https://img.youtube.com/vi/0zM3nApSvMg/hqdefault.jpg" alt="Old Format">
    <p>Old Format</p>
  </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
  const sidePanel=document.getElementById('sidePanel');
  const playerContainer=document.getElementById('playerContainer');
  const spinner=document.getElementById('spinner');
  const poster=document.getElementById('poster');
  let ytPlayer,currentVideoId='',startVideoId='';

  function toggleMenu(){sidePanel.classList.toggle('open')}

  function extractVideoId(url){
    if(!url)return null;
    const re=/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/|youtube\.com\/shorts\/|youtube\.com\/live\/)([^"&?\/\s]{11})/i;
    const m=url.match(re);return m?m[1]:null;
  }
  function setActiveItem(id){
    document.querySelectorAll('.playlist-item').forEach(el=>{
      el.classList.toggle('active',extractVideoId(el.dataset.video)===id);
    });
  }
  function loadVideo(id){
    if(!id)return;
    currentVideoId=id;
    poster.style.display='block';
    spinner.style.display='block';
    playerContainer.classList.remove('loaded');
    if(ytPlayer){ytPlayer.loadVideoById(id);setActiveItem(id);return;}
    startVideoId=id;
  }
  function onYouTubeIframeAPIReady(){
    ytPlayer=new YT.Player('player',{
      height:'100%',width:'100%',videoId:startVideoId,
      playerVars:{autoplay:1,mute:1,controls:1,rel:0,modestbranding:1,playsinline:1,fs:1},
      events:{
        onReady:e=>{
          spinner.style.display='none';
          poster.style.display='none';
          playerContainer.classList.add('loaded');
          e.target.playVideo();
          setActiveItem(startVideoId);
        }
      }
    });
  }
  document.querySelectorAll('.playlist-item').forEach(item=>{
    item.addEventListener('click',()=>{
      const id=extractVideoId(item.dataset.video);
      if(id)loadVideo(id);
    });
  });
  window.addEventListener('load',()=>{
    const firstId=extractVideoId(document.querySelector('.playlist-item').dataset.video);
    if(firstId)loadVideo(firstId);
  });
  playerContainer.addEventListener('click',()=>{
    if(ytPlayer&&ytPlayer.unMute){ytPlayer.unMute();ytPlayer.setVolume(70);}
  });
  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
</script>
</body>
</html>
