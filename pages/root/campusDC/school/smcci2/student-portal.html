<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Portal – Saint Michael College</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --primary: #003082;
            --secondary: #f5f7fa;
            --accent: #ff9d00;
            --text: #222;
            --light: #fff;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: var(--secondary);
            color: var(--text);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: var(--primary);
            color: var(--light);
            padding: 1rem 0;
        }
        .container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
        }
        h1 {
            text-align: center;
            margin: 2rem 0 1rem;
            color: var(--primary);
        }
        .portal-box {
            background: var(--light);
            border-radius: 8px;
            padding: 2rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: 0 auto 3rem;
        }
        .portal-box label {
            display: block;
            margin: 0.75rem 0 0.25rem;
            font-weight: 600;
        }
        .portal-box input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .portal-box button {
            margin-top: 1rem;
            width: 100%;
        }
        .btn {
            background: var(--accent);
            color: var(--light);
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
        }
        .btn:hover {
            background: #e08c00;
        }
        footer {
            background: var(--primary);
            color: var(--light);
            text-align: center;
            padding: 1rem 0;
            margin-top: auto;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h2 style="margin:0;">Saint Michael College – Student Portal</h2>
        </div>
    </header>

    <main>
        <h1>Login to Student Portal</h1>
        <div class="portal-box">
            <form onsubmit="event.preventDefault(); alert('Demo only – integrate real login here.');">
                <label for="sid">Student ID</label>
                <input type="text" id="sid" placeholder="e.g. 2021-001234" required>

                <label for="pin">PIN / Password</label>
                <input type="password" id="pin" required>

                <button type="submit" class="btn">Sign In</button>
            </form>
        </div>
    </main>

    <footer>
        © <span id="year"></span> Saint Michael College, Cantilan, Inc.
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
