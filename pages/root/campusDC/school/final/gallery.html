<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | SMCCI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root{--primary:#1e3a8a;--secondary:#fbbf24;--white:#fff;--grey:#f9fafb}
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
        body{background:var(--grey);color:#1f2937;line-height:1.6}
        a{text-decoration:none;color:inherit}
        header{background:var(--white);box-shadow:0 2px 8px rgba(0,0,0,.08);padding:20px 0}
        .header-container{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
        .logo{display:flex;align-items:center;gap:12px}
        .logo img{width:46px;height:46px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;color:var(--white);font-weight:bold}
        .back-home{background:var(--primary);color:var(--white);padding:8px 18px;border-radius:25px;font-size:.9rem;transition:background .3s}
        .back-home:hover{background:#152c6e}
        main{max-width:1000px;margin:40px auto;padding:0 20px}
        h2{margin-bottom:25px;color:var(--primary)}
        .album{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
        .photo-card{background:var(--white);border-radius:10px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,.05);transition:transform .3s}
        .photo-card:hover{transform:scale(1.03)}
        .photo-card img{width:100%;height:200px;object-fit:cover;display:block}
        .photo-caption{padding:14px;font-size:.95rem;text-align:center;color:#6b7280}
        @media(max-width:600px){.header-container{flex-direction:column;gap:10px}}
    </style>
</head>
<body>
<header>
    <div class="header-container">
        <div class="logo">
            <img src="smcci.png" alt="SMCCI Logo">
            <div>
                <h1 style="font-size:1.3rem;color:var(--primary)">Saint Michael College</h1>
                <small style="color:#6b7280">Cantilan, Inc.</small>
            </div>
        </div>
        <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>
</header>

<main>
    <h2><i class="fas fa-images"></i> Campus Gallery</h2>

    <div class="album">
        <div class="photo-card">
            <img src="https://smcci.net/wp-content/uploads/2024/11/461679679_1074397654694766_5687040296921546614_n-768x432.jpg" alt="Graduation 2025">
            <div class="photo-caption">109th Foundation Day</div>
        </div>
        <div class="photo-card">
            <img src="https://smcci.net/wp-content/uploads/2024/11/461687284_1073692734765258_1589810528411653997_n-1-768x513.jpg" alt="Intramurals">
            <div class="photo-caption">The Lantern Procession 2024</div>
        </div>
        <div class="photo-card">
            <img src="https://smcci.net/wp-content/uploads/2024/11/460717344_932826392208286_6875008855802925131_n-1-768x511.jpg" alt="Simbang Gabi">
            <div class="photo-caption">RENDEZVOUS 2024</div>
        </div>
        <div class="photo-card">
            <img src="https://smcci.net/wp-content/uploads/2024/11/461367366_1070668391734359_1058474150292457220_n-1-768x432.jpg" alt="STEM Expo">
            <div class="photo-caption">The Palistohay Intramural 2024</div>
        </div>
        <div class="photo-card">
            <img src="https://smcci.net/wp-content/uploads/2024/11/465137234_1103208798480318_5777614728076472072_n-768x722.jpg" alt="New Library">
            <div class="photo-caption">
NOVEMBER 2 | COMMEMORATION OF ALL THE FAITHFUL DEPARTE</div>
        </div>
        <div class="photo-card">
            <img src="https://smcci.net/wp-content/uploads/2024/11/468581720_1123825209752010_8059464231330406156_n-709x1024.jpeg" alt="Outreach">
            <div class="photo-caption">
Today is RED WEDNESDAY.
November 27, 2024  No Comments</div>
        </div>
    </div>
</main>
</body>
</html>
