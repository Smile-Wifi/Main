<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join Alliance — S.A.G.A³</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="bgCanvas"></canvas>
<header>
  <button class="hamburger" id="hamburger" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>
</header>
<div class="overlay" id="overlay"></div>
<aside class="side-panel" id="sidePanel">
  <button class="close-btn" id="closeBtn" aria-label="Close menu">×</button>
  <nav>
    <a href="index.html">Home</a>
    <a href="index.html#about">About</a>
    <a href="index.html#news">News</a>
    <a href="apply.html">Academy</a>
    <a href="alliance.html">Alliance</a>
    <a href="admin.html">Admin</a>
    <a href="alliance.html" class="btn" style="margin-top:20px; width:100%; justify-content:center;">Join</a>
  </nav>
</aside></header>

  <main class="container">
    <section style="padding:80px 0">
      <div class="split">
        <div class="card">
          <h3>Alliance Tiers</h3>
          <ul class="small">
            <li><strong>Founding:</strong> Co-governance, board seat</li>
            <li><strong>Strategic:</strong> Compute credits, co-investment</li>
            <li><strong>Corporate:</strong> Priority access</li>
            <li><strong>SME:</strong> Incubation support</li>
          </ul>
        </div>
        <div class="card">
          <h3>Join the Alliance</h3>
          <form id="joinForm">
            <div class="form-group"><label>Organization *</label><input id="mOrg" required /></div>
            <div class="form-group"><label>Name *</label><input id="mName" required /></div>
            <div class="form-group"><label>Email *</label><input id="mEmail" type="email" required /></div>
            <div class="form-group"><label>Tier *</label>
              <select id="mTier"><option>Founding</option><option>Strategic</option><option>Corporate</option><option>SME</option></select>
            </div>
            <div class="form-group"><label>Notes</label><textarea id="mNotes"></textarea></div>
            <div style="display:flex; gap:10px; margin-top:12px">
              <button type="button" class="btn" onclick="joinAlliance()">Submit</button>
              <button type="button" class="ghost" onclick="document.getElementById('joinForm').reset()">Reset</button>
            </div>
            <div id="joinMsg" class="small" style="margin-top:10px"></div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer><div class="container small">© 2025 S.A.G.A³</div></footer>
  <script src="script.js"></script>
</body>
</html>
