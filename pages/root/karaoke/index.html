<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Smile Wi-Fi Karaoke</title>
<style>
:root{--yellow:#fdd835;--bg:#0d0d0d;--panel:#1b1b1b;--text:#fff;--accent:#ff4081}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
header{width:100%;background:#111;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:2000}
header h1{flex:1;text-align:center;font-size:1.4rem;color:var(--yellow)}
#menuBtn{background:none;border:none;color:#fff;font-size:28px;cursor:pointer}
#sidePanel{position:fixed;top:60px;left:-250px;width:250px;height:100%;background:var(--panel);padding:15px;transition:left .3s;z-index:1800}
#sidePanel a{display:block;padding:12px;color:#fff;text-decoration:none;border-bottom:1px solid #333;font-size:16px}
#sidePanel a:hover{background:var(--accent);color:#fff}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:none;z-index:1500}
main{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;padding:20px;text-align:center}
.notice{color:#90caf9;margin-bottom:10px}
.search-box{width:100%;max-width:600px;margin-bottom:15px}
.search-box input{width:100%;padding:10px 14px;border-radius:8px;border:none;font-size:1rem;outline:none}
.player-container{width:100%;max-width:720px;margin-bottom:20px}
video{width:100%;border-radius:10px;background:#000}
.song-list{width:100%;max-width:600px;background:#1b1b1b;border-radius:10px;padding:10px;overflow-y:auto;max-height:350px}
.song{padding:10px 12px;border-bottom:1px solid #333;cursor:pointer;transition:background .2s}
.song:last-child{border-bottom:none}
.song:hover{background:#333}
.song.active{background:var(--yellow);color:#000;font-weight:bold}
footer{background:#111;width:100%;text-align:center;padding:10px;color:#777;font-size:.85rem}
#loading{color:#aaa;font-style:italic}
</style>
</head>
<body>

<header>
  <button id="menuBtn">Menu</button>
  <h1>Smile Wi-Fi Karaoke</h1>
</header>

<div id="sidePanel">
  <a href="https://smile-wifi.github.io/Main">Home</a>
  <a href="../../../index.html">About</a>
  <a href="#" id="refreshBtn">Refresh Videos</a>
</div>
<div id="overlay"></div>

<main>
  <div class="notice" id="songCount">Loading songs from GitHub…</div>
  <div class="search-box">
    <input type="text" id="search" placeholder="Search song..." onkeyup="filterSongs()">
  </div>
  <div class="player-container">
    <video id="player" controls preload="metadata" src=""></video>
  </div>
  <div class="song-list" id="songList">
    <div id="loading">Scanning repository…</div>
  </div>
</main>

<footer>© <span id="year"></span> Smile Wi-Fi Karaoke</footer>

<script>
// ---- Config -------------------------------------------------
const REPO_OWNER = 'Smile-Wifi';
const REPO_NAME  = 'karaoke-auto';
const BRANCH     = 'main';               // change if you use "master"
const RAW_BASE   = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}`;
// -------------------------------------------------------------

document.getElementById('year').textContent = new Date().getFullYear();

const player     = document.getElementById('player');
const songList   = document.getElementById('songList');
const songCount  = document.getElementById('songCount');
const searchInp  = document.getElementById('search');
const menuBtn    = document.getElementById('menuBtn');
const sidePanel  = document.getElementById('sidePanel');
const overlay    = document.getElementById('overlay');
const refreshBtn = document.getElementById('refreshBtn');

let songs = [];

// ---- Fetch file tree from GitHub API ------------------------
async function loadMP4sFromGitHub() {
  songList.innerHTML = '<div id="loading">Fetching repository tree…</div>';
  try {
    const treeUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/trees/${BRANCH}?recursive=1`;
    const resp = await fetch(treeUrl);
    if (!resp.ok) throw new Error(`GitHub API ${resp.status}`);
    const data = await resp.json();

    // Collect every .mp4 path
    songs = data.tree
      .filter(item => item.type === 'blob' && item.path.toLowerCase().endsWith('.mp4'))
      .map(item => item.path)
      .sort((a,b) => a.localeCompare(b, undefined, {numeric:true}));

    renderSongs();
  } catch (e) {
    console.error(e);
    songCount.textContent = 'Error loading songs (check console).';
    songList.innerHTML = `<div style="color:#faa">Failed to fetch file list.<br>Make sure the repo is public and the branch name is correct.</div>`;
  }
}

// ---- Render song list ---------------------------------------
function renderSongs() {
  songList.innerHTML = '';
  if (!songs.length) {
    songCount.textContent = 'No .mp4 files found in the repository.';
    songList.innerHTML = '<div style="padding:20px;color:#aaa">Add karaoke videos to the repo.</div>';
    return;
  }

  songCount.textContent = `${songs.length} song${songs.length>1?'s':''} available`;

  songs.forEach(path => {
    const div = document.createElement('div');
    div.className = 'song';
    div.dataset.file = `${RAW_BASE}/${encodeURIComponent(path)}`;
    div.textContent = cleanName(path);
    div.addEventListener('click', () => playSong(div));
    songList.appendChild(div);
  });
}

function cleanName(path) {
  const name = path.split('/').pop();               // file name only
  return decodeURIComponent(name)
    .replace(/\.mp4$/i, '')
    .replace(/_/g, ' ')
    .replace(/-/g, ' ')
    .replace(/\b\w/g, c => c.toUpperCase());
}

// ---- Playback ------------------------------------------------
function playSong(el) {
  document.querySelectorAll('.song').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
  player.src = el.dataset.file;
  player.play().catch(err => console.warn('Play error:', err));
}

// ---- Search --------------------------------------------------
function filterSongs() {
  const term = searchInp.value.toLowerCase();
  document.querySelectorAll('.song').forEach(s => {
    s.style.display = s.textContent.toLowerCase().includes(term) ? '' : 'none';
  });
}

// ---- UI (menu) -----------------------------------------------
menuBtn.onclick = () => {
  sidePanel.style.left = '0';
  overlay.style.display = 'block';
};
overlay.onclick = () => {
  sidePanel.style.left = '-250px';
  overlay.style.display = 'none';
};
refreshBtn.onclick = e => { e.preventDefault(); songs=[]; loadMP4sFromGitHub(); };

// ---- Init ----------------------------------------------------
loadMP4sFromGitHub();
</script>
</body>
</html>
