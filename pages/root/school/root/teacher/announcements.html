<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Announcements</title>
  <script type="module" src="../shared/app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

  <header class="bg-indigo-600 text-white p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold">Announcements</h1>
    <a href="dashboard.html" class="bg-white text-indigo-600 px-3 py-1 rounded">Back</a>
  </header>

  <main class="p-6">
    <form id="annForm" class="bg-white p-6 rounded shadow max-w-lg mx-auto mb-6">
      <input type="text" id="annInput" placeholder="New announcement..."
        class="w-full border p-2 rounded" required>
      <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded mt-2">Post</button>
    </form>

    <div id="annList" class="space-y-2"></div>
  </main>
</body>
</html>
