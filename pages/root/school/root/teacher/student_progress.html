<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Progress</title>
  <script type="module" src="../shared/app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

  <header class="bg-indigo-600 text-white p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold">Student Progress</h1>
    <a href="dashboard.html" class="bg-white text-indigo-600 px-3 py-1 rounded">Back</a>
  </header>

  <main class="p-6">
    <div id="progressList" class="space-y-4"></div>

    <script type="module">
      import { supabase } from '../shared/app.js';

      async function renderProgress() {
        const { data: grades } = await supabase.from('grades').select(`
          student_id, assignment_id, grade, feedback,
          profiles(full_name),
          assignments(title)
        `);

        const list = document.getElementById('progressList');
        list.innerHTML = grades.map(g => `
          <div class="bg-white p-4 rounded shadow">
            <h3 class="font-semibold">${g.profiles.full_name}</h3>
            <p>Assignment: ${g.assignments.title}</p>
            <p>Grade: ${g.grade || 'Pending'}</p>
            <p class="text-sm text-gray-600">Feedback: ${g.feedback || '—'}</p>
          </div>
        `).join('');
      }

      renderProgress();

      supabase.from('grades').on('INSERT', renderProgress).subscribe();
      supabase.from('grades').on('UPDATE', renderProgress).subscribe();
    </script>
  </main>
</body>
</html>
