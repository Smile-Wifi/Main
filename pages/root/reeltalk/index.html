<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReelTalk Auto Scroll</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#000;
  color:#fff;
  font-family:sans-serif;
  overflow:hidden;
}
h1.header{
  position:fixed;
  top:10px;left:50%;
  transform:translateX(-50%);
  color:#ff4b2b;
  z-index:30;
  text-shadow:0 0 10px #000;
}

/* --- Scroll Area --- */
.wrapper{
  height:100vh;
  width:100%;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
  scroll-behavior:smooth;
}
.video-container{
  height:100vh;
  scroll-snap-align:start;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
}
video{
  height:100vh;
  width:100%;
  object-fit:cover;
  background:#000;
}

/* Overlay username + filename */
.overlay{
  position:absolute;
  bottom:40px;
  left:20px;
  color:#fff;
  text-shadow:0 0 8px #000;
  font-size:16px;
}
.overlay .username{
  display:block;
  font-weight:bold;
  font-size:18px;
  color:#ff4b2b;
  margin-bottom:6px;
}
.overlay .filename{
  opacity:0.8;
  font-size:14px;
}

/* --- End screen --- */
.end{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#ccc;
}

/* --- Welcome Screen --- */
#welcome-screen{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:1000;
  opacity:1;
  transition:opacity 1s ease, transform 1s ease;
}
#welcome-screen.hidden{
  opacity:0;
  transform:scale(1.1);
  pointer-events:none;
}
#welcome-screen img{
  width:220px;
  height:auto;
  margin-bottom:20px;
  animation:pulse 2s infinite;
  cursor:pointer;
}
@keyframes pulse{
  0%{transform:scale(1);opacity:1;}
  50%{transform:scale(1.05);opacity:0.8;}
  100%{transform:scale(1);opacity:1;}
}

/* --- Hamburger menu --- */
.hamburger{
  position:fixed;
  top:15px;
  right:20px;
  width:30px;
  height:22px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  cursor:pointer;
  z-index:40;
}
.hamburger div{
  width:100%;
  height:4px;
  background:#ff4b2b;
  border-radius:2px;
  transition:0.3s;
}
#sideMenu{
  position:fixed;
  top:0;
  left:-250px;
  width:250px;
  height:100%;
  background:rgba(20,20,20,0.95);
  backdrop-filter:blur(5px);
  box-shadow:2px 0 10px rgba(0,0,0,0.6);
  z-index:35;
  transition:left 0.4s ease;
  padding-top:80px;
}
#sideMenu.active{left:0;}
#sideMenu a{
  display:block;
  color:#fff;
  text-decoration:none;
  padding:15px 20px;
  font-size:18px;
  border-bottom:1px solid rgba(255,255,255,0.1);
}
#sideMenu a:hover{background:#ff4b2b;color:#fff;}
</style>
</head>
<body>
<h1 class="header">🎬 ReelTalk</h1>

<!-- 🍔 Hamburger -->
<div class="hamburger" id="menuToggle">
  <div></div>
  <div></div>
  <div></div>
</div>

<!-- 🧭 Side Panel -->
<div id="sideMenu">
  <a href="https://smile-wifi.github.io/Main">🏠 Home</a>
  <a href="/pages/root/about.html">ℹ️ About</a>
  <a href="#" id="refreshBtn">🔄 Refresh Videos</a>
</div>

<!-- 🖼️ Welcome Screen -->
<div id="welcome-screen">
    <img id="welcomeLogo" src="reeltalk.png" alt="Welcome Logo">
</div>

<!-- 🎵 Background audio -->
<audio id="bgMusic" src="/media/audio/intro.mp3" preload="auto"></audio>

<div class="wrapper" id="videoWrapper"></div>

<script>
// --- Service Worker registration ---
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").then(() => {
    console.log("✅ Service Worker registered");
  }).catch(console.error);
}

// --- GitHub auto-fetch ---
const repoOwner = "Smile-Wifi";
const repoName = "reeltalk-auto";
const videoWrapper = document.getElementById("videoWrapper");
const bgMusic = document.getElementById("bgMusic");
const welcome = document.getElementById("welcome-screen");
const logo = document.getElementById("welcomeLogo");
const menuToggle = document.getElementById("menuToggle");
const sideMenu = document.getElementById("sideMenu");
const refreshBtn = document.getElementById("refreshBtn");

let videos = [];
let currentIndex = 0;
let canSwipe = false;

async function loadVideos() {
  try {
    const res = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/`);
    const files = await res.json();
    const mp4s = files.filter(f => f.name.endsWith(".mp4"));

    if (mp4s.length === 0) {
      videoWrapper.innerHTML = `<div class='end'>No videos found in GitHub.</div>`;
      return;
    }

    videoWrapper.innerHTML = mp4s.map((file, i) => `
      <div class="video-container">
        <video class="video-player" playsinline preload="auto" muted data-index="${i}">
          <source src="https://raw.githubusercontent.com/${repoOwner}/${repoName}/main/${file.name}" type="video/mp4">
        </video>
        <div class="overlay">
          <span class="username">@reeltalk</span>
          <span class="filename">${file.name}</span>
        </div>
      </div>
    `).join("") + `<div class="end">🎉 You've reached the end!</div>`;

    setupVideoControls();
  } catch (err) {
    console.error(err);
    videoWrapper.innerHTML = `<div class='end'>⚠️ Error loading videos.</div>`;
  }
}

function setupVideoControls() {
  videos = document.querySelectorAll('.video-player');

  videos.forEach((v,i)=>{
    v.addEventListener('ended',()=>{
      canSwipe = false;
      setTimeout(()=>{
        if(videos[i+1]){
          videos[i+1].scrollIntoView({behavior:'smooth'});
          setTimeout(()=>playVideo(i+1),1000);
          currentIndex = i+1;
        }
        canSwipe = true;
      },2000);
    });
  });

  let scrollTimeout;
  const wrapper = document.querySelector('.wrapper');
  wrapper.addEventListener('scroll',()=>{
    clearTimeout(scrollTimeout);
    if(!canSwipe) return;
    scrollTimeout = setTimeout(()=>{
      const index = Math.round(wrapper.scrollTop / window.innerHeight);
      if(index !== currentIndex){
        currentIndex = index;
        playVideo(currentIndex);
      }
    },200);
  });
}

function playVideo(index){
  videos.forEach((v,i)=>{
    if(i===index){ v.play().catch(()=>{}); }
    else { v.pause(); v.currentTime=0; }
  });
}

// --- Menu toggle ---
menuToggle.addEventListener('click',()=> sideMenu.classList.toggle('active'));

// --- Refresh ---
refreshBtn.addEventListener('click',()=> location.reload());

// --- Start after click ---
logo.addEventListener('click', () => {
  welcome.classList.add('hidden');
  bgMusic.volume = 0.5;
  bgMusic.play().catch(()=>{});
  videos.forEach(v => v.muted = false);
  playVideo(0);
  canSwipe = true;
});

// Load videos
loadVideos();
</script>
</body>
</html>
