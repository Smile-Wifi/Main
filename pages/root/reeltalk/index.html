<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ReelTalk Auto Scroll</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;color:#fff;font-family:sans-serif;overflow:hidden;}
h1.header{position:fixed;top:10px;left:50%;transform:translateX(-50%);color:#ff4b2b;z-index:30;text-shadow:0 0 10px #000;}
.wrapper{height:100vh;width:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scroll-behavior:smooth;}
.video-container{height:100vh;scroll-snap-align:start;position:relative;display:flex;justify-content:center;align-items:center;}
video{height:100vh;width:100%;object-fit:cover;background:#000;}
.overlay{position:absolute;bottom:40px;left:20px;color:#fff;text-shadow:0 0 8px #000;font-size:16px;}
.overlay .username{display:block;font-weight:bold;font-size:18px;color:#ff4b2b;margin-bottom:6px;}
.overlay .filename{opacity:0.8;font-size:14px;}
.end{height:100vh;display:flex;align-items:center;justify-content:center;color:#ccc;}
#welcome-screen{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:1000;opacity:1;transition:opacity 1s ease,transform 1s ease;}
#welcome-screen.hidden{opacity:0;transform:scale(1.1);pointer-events:none;}
#welcome-screen img{width:220px;height:auto;margin-bottom:20px;animation:pulse 2s infinite;cursor:pointer;}
@keyframes pulse{0%{transform:scale(1);opacity:1;}50%{transform:scale(1.05);opacity:0.8;}100%{transform:scale(1);opacity:1;}}
.hamburger{position:fixed;top:15px;right:20px;width:30px;height:22px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;z-index:40;}
.hamburger div{width:100%;height:4px;background:#ff4b2b;border-radius:2px;transition:0.3s;}
#sideMenu{position:fixed;top:0;left:-250px;width:250px;height:100%;background:rgba(20,20,20,0.95);backdrop-filter:blur(5px);box-shadow:2px 0 10px rgba(0,0,0,0.6);z-index:35;transition:left 0.4s ease;padding-top:80px;}
#sideMenu.active{left:0;}
#sideMenu a{display:block;color:#fff;text-decoration:none;padding:15px 20px;font-size:18px;border-bottom:1px solid rgba(255,255,255,0.1);}
#sideMenu a:hover{background:#ff4b2b;color:#fff;}
</style>
</head>
<body>
<h1 class="header">🎬 ReelTalk</h1>

<div class="hamburger" id="menuToggle"><div></div><div></div><div></div></div>

<div id="sideMenu">
  <a href="https://smile-wifi.github.io/Main">🏠 Home</a>
  <a href="/pages/root/about.html">ℹ️ About</a>
  <a href="#" id="refreshBtn">🔄 Refresh Videos</a>
</div>

<div id="welcome-screen">
  <img id="welcomeLogo" src="reeltalk.png" alt="Welcome Logo">
</div>

<audio id="bgMusic" src="/media/audio/intro.mp3" preload="auto"></audio>

<div class="wrapper" id="videoWrapper">
  <div class="end" id="loadingMsg">Loading videos...</div>
</div>

<script>
// --- CONFIG --- //
const owner = "Smile-Wifi";
const repo = "reeltalk-auto";
const folderPath = ""; // folder path if videos are in subfolder
const usernameTag = "@jorjanlanaja";

const apiURL = `https://api.github.com/repos/${owner}/${repo}/contents/${folderPath}`;
const wrapper = document.getElementById("videoWrapper");
const bgMusic = document.getElementById("bgMusic");
const welcome = document.getElementById("welcome-screen");
const logo = document.getElementById("welcomeLogo");
const menuToggle = document.getElementById("menuToggle");
const sideMenu = document.getElementById("sideMenu");
const refreshBtn = document.getElementById("refreshBtn");

let videos = [];
let currentIndex = 0;
let canSwipe = false;

// --- Menu toggle --- //
menuToggle.addEventListener("click", () => sideMenu.classList.toggle("active"));
refreshBtn.addEventListener("click", () => location.reload());

// --- Load from GitHub (with LocalStorage cache) --- //
async function loadVideos() {
  try {
    const cacheKey = "reeltalk_videos_cache";
    const cacheTimeKey = "reeltalk_videos_cache_time";
    const oneDay = 1000 * 60 * 60 * 24;

    let data;
    const cached = localStorage.getItem(cacheKey);
    const cachedTime = localStorage.getItem(cacheTimeKey);

    if (cached && cachedTime && Date.now() - cachedTime < oneDay) {
      console.log("Loaded from cache ✅");
      data = JSON.parse(cached);
    } else {
      console.log("Fetching from GitHub...");
      const res = await fetch(apiURL);
      if (!res.ok) throw new Error("GitHub API error");
      const files = await res.json();
      data = files.filter(f => f.name.toLowerCase().endsWith(".mp4"));
      localStorage.setItem(cacheKey, JSON.stringify(data));
      localStorage.setItem(cacheTimeKey, Date.now());
    }

    if (!data.length) {
      wrapper.innerHTML = `<div class="end">No videos found in ${folderPath}</div>`;
      return;
    }

    wrapper.innerHTML = data.map((file, i) => `
      <div class="video-container">
        <video class="video-player" playsinline preload="auto" data-index="${i}" muted>
          <source src="${file.download_url}" type="video/mp4">
        </video>
        <div class="overlay">
          <span class="username">${usernameTag}</span>
          <span class="filename">${file.name}</span>
        </div>
      </div>
    `).join("") + `<div class="end">🎉 You've reached the end!</div>`;

    videos = document.querySelectorAll(".video-player");
    initVideoScroll();
  } catch (err) {
    wrapper.innerHTML = `<div class="end">⚠️ Failed to load videos. Offline?</div>`;
    console.error(err);
  }
}

// --- Scroll & Video Logic --- //
function playVideo(index) {
  videos.forEach((v,i)=>{
    if(i===index) v.play().catch(()=>{});
    else {v.pause();v.currentTime=0;}
  });
}

function initVideoScroll() {
  videos.forEach((v,i)=>{
    v.addEventListener("ended",()=>{
      canSwipe=false;
      setTimeout(()=>{
        if(videos[i+1]){
          videos[i+1].scrollIntoView({behavior:"smooth"});
          setTimeout(()=>playVideo(i+1),1000);
          currentIndex=i+1;
        }
        canSwipe=true;
      },2000);
    });
  });

  let scrollTimeout;
  wrapper.addEventListener("scroll",()=>{
    clearTimeout(scrollTimeout);
    if(!canSwipe) return;
    scrollTimeout=setTimeout(()=>{
      const index=Math.round(wrapper.scrollTop/window.innerHeight);
      if(index!==currentIndex){currentIndex=index;playVideo(currentIndex);}
    },200);
  });
}

// --- Welcome logo click --- //
logo.addEventListener("click",()=>{
  welcome.classList.add("hidden");
  bgMusic.volume=0.5;
  bgMusic.play().catch(()=>{});
  videos.forEach(v=>v.muted=false);
  playVideo(0);
  canSwipe=true;
});

// --- Register Service Worker for offline caching --- //
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").then(()=>console.log("ServiceWorker registered ✅"));
  });
}

// --- INIT --- //
loadVideos();
</script>
</body>
</html>
