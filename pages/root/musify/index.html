<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Musify Auto Installer</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3046/3046127.png" />

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(180deg, #000 0%, #111 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: "Segoe UI", sans-serif;
    }
    h1 {
      font-size: 2.2em;
      margin-bottom: 10px;
    }
    p {
      color: #bbb;
      max-width: 300px;
      line-height: 1.5;
    }
    button {
      background: #1db954;
      color: #fff;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 25px;
      transition: 0.3s;
    }
    button:hover {
      background: #17a34a;
      transform: scale(1.05);
    }
    #status {
      margin-top: 20px;
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <h1>🎧 Install Musify</h1>
  <p>Install the Musify PWA app to continue to the full experience.</p>
  <button id="installBtn" hidden>📲 Install App</button>
  <div id="status">Loading...</div>

  <script>
    const installBtn = document.getElementById('installBtn');
    const status = document.getElementById('status');
    let deferredPrompt;
    const redirectLink = "https://smile-wifi.github.io/Main/";

    // Detect already installed app
    if (window.matchMedia('(display-mode: standalone)').matches) {
      status.textContent = "✅ App already installed! Redirecting...";
      setTimeout(() => (window.location.href = redirectLink), 2000);
    }

    // Handle install prompt
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.hidden = false;
      status.textContent = "Ready to install Musify.";
    });

    installBtn.addEventListener('click', async () => {
      installBtn.hidden = true;
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          status.textContent = "✅ App installed! Redirecting...";
          setTimeout(() => (window.location.href = redirectLink), 2500);
        } else {
          status.textContent = "❌ Installation cancelled.";
          installBtn.hidden = false;
        }
        deferredPrompt = null;
      }
    });

    // Detect install event
    window.addEventListener('appinstalled', () => {
      status.textContent = "✅ Musify installed! Opening app...";
      setTimeout(() => (window.location.href = redirectLink), 2000);
    });

    // Register Service Worker
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker
        .register("sw.js")
        .then(() => console.log("✅ Service Worker registered"))
        .catch((err) => console.error("SW error:", err));
    }
  </script>
</body>
</html>
