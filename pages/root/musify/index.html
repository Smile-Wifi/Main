<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TikTok Style Feed</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Icon (external, safe even without local icons) -->
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3046/3046127.png">

<!-- FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- PWA -->
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">

<style>
  :root { --primary:#ff0050; --bg:#000; --text:#fff; --shadow:rgba(0,0,0,0.6); }
  *{margin:0;padding:0;box-sizing:border-box;}
  body,html{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;}

  #videoContainer{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:#000;overflow:hidden;
  }
  iframe{
    width:100vw;height:100vh;border:0;position:absolute;top:0;left:0;
  }

  #volumeBtn{
    position:absolute;top:20px;right:20px;width:44px;height:44px;
    background:rgba(0,0,0,0.5);border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:20px;color:#fff;z-index:10;backdrop-filter:blur(8px);
  }

  #hamburger{position:fixed;top:20px;left:20px;font-size:28px;color:#fff;cursor:pointer;z-index:11;}
  #sidePanel{
    position:fixed;top:0;left:-250px;width:250px;height:100%;
    background:rgba(0,0,0,0.98);color:#fff;padding:70px 20px 20px;
    transition:left .3s;z-index:20;
  }
  #sidePanel.open{left:0;}

  #infoPanel{position:absolute;bottom:80px;left:20px;right:80px;text-shadow:0 1px 3px var(--shadow);}
  #username{font-size:18px;font-weight:700;}
  #caption{font-size:14px;margin-top:4px;opacity:0.9;}

  #actionBar{
    position:absolute;right:15px;bottom:90px;display:flex;flex-direction:column;
    align-items:center;gap:20px;z-index:10;
  }
  .action-item{text-align:center;color:#fff;cursor:pointer;}
  .action-icon{
    width:48px;height:48px;border-radius:50%;
    background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;
    font-size:24px;margin-bottom:6px;
  }

  #loader{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#000;color:#fff;flex-direction:column;font-size:20px;z-index:100;
  }
  .spinner{width:40px;height:40px;border:4px solid #333;border-top:4px solid var(--primary);
    border-radius:50%;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  #sharePopup{
    position:fixed;bottom:110px;right:75px;background:#222;padding:15px;
    border-radius:12px;display:none;flex-direction:column;gap:10px;z-index:20;
  }
  .share-option{display:flex;align-items:center;gap:8px;cursor:pointer;}
  .share-option:hover{color:var(--primary);}
</style>
</head>
<body>

<div id="hamburger"><i class="fas fa-bars"></i></div>

<nav id="sidePanel">
  <a class="menu-item" href="https://smile-wifi.github.io/Main" target="_blank" style="color:white;text-decoration:none;display:block;padding:15px 0;border-bottom:1px solid #333;">
    <i class="fas fa-home"></i> Home
  </a>
  <div class="menu-item" id="refreshBtn" style="padding:15px 0;border-bottom:1px solid #333;cursor:pointer;">
    <i class="fas fa-sync-alt"></i> Refresh
  </div>
</nav>

<div id="videoContainer">
  <iframe id="frame" allow="autoplay; fullscreen"></iframe>

  <div id="volumeBtn"><i class="fas fa-volume-mute" id="volumeIcon"></i></div>
</div>

<div id="infoPanel">
  <div id="username">@user123</div>
  <div id="caption">Check out this clip!</div>
</div>

<div id="actionBar">
  <div class="action-item" id="likeBtn">
    <div class="action-icon"><i class="far fa-heart"></i></div>
    <div id="likeCount">12.4k</div>
  </div>
  <div class="action-item"><div class="action-icon"><i class="far fa-comment"></i></div>342</div>
  <div class="action-item"><div class="action-icon"><i class="far fa-bookmark"></i></div>89</div>
  <div class="action-item" id="shareBtn"><div class="action-icon"><i class="fas fa-share"></i></div>Share</div>
</div>

<div id="sharePopup">
  <div class="share-option" id="fbShare"><i class="fab fa-facebook"></i> Facebook</div>
  <div class="share-option" id="twShare"><i class="fab fa-x-twitter"></i> Twitter</div>
  <div class="share-option" id="waShare"><i class="fab fa-whatsapp"></i> WhatsApp</div>
  <div class="share-option" id="copyLink"><i class="fas fa-link"></i> Copy Link</div>
</div>

<div id="loader">
  <div class="spinner"></div>
  Loading videos...
</div>

<script>
// --- Vimeo Videos (Your URLs) ---
const videos = [
  "https://player.vimeo.com/video/1137951830?h=ec",
  "https://player.vimeo.com/video/1137951814?h=ec",
  "https://player.vimeo.com/video/1137951788?h=ec"
];

let idx = 0;
let muted = true;

const frame = document.getElementById("frame");
const loader = document.getElementById("loader");
const usernameEl = document.getElementById("username");
const captionEl = document.getElementById("caption");
const likeCountEl = document.getElementById("likeCount");
const volumeIcon = document.getElementById("volumeIcon");

// Random names & captions
const usernames=["coolvibes","danceking","funnycat","travelpro","foodie","gamer","artist","dreamer"];
const captions=[
  "This is fire!", "Wait for it...", "POV: Challenge time!",
  "Life hack!", "Morning vibes", "Just vibing!",
  "Unbelievable!", "Tag someone!"
];

function randomUsername(){ return "@"+usernames[Math.floor(Math.random()*usernames.length)] + Math.floor(Math.random()*999); }
function randomCaption(){ return captions[Math.floor(Math.random()*captions.length)]; }
function randomLikes(){
  const n=Math.random();
  if(n>0.9)return (100+Math.floor(Math.random()*900))+"k";
  return Math.floor(Math.random()*900)+100;
}

// Load a video
function play(i){
  if(i<0) i = videos.length-1;
  if(i>=videos.length) i = 0;
  idx = i;

  frame.src = videos[idx] + (muted ? "&muted=1&autoplay=1" : "&autoplay=1");

  usernameEl.textContent = randomUsername();
  captionEl.textContent = randomCaption();
  likeCountEl.textContent = randomLikes();

  loader.style.display="none";
}

play(0);

// Swipe controls
let startY=0;
document.body.addEventListener("touchstart",e=>startY=e.changedTouches[0].screenY);
document.body.addEventListener("touchend",e=>{
  let dy = startY - e.changedTouches[0].screenY;
  if(Math.abs(dy)>80) play(idx + (dy>0?1:-1));
});

// Scroll controls
document.body.addEventListener("wheel",e=>{
  if(e.deltaY>30) play(idx+1);
  else if(e.deltaY<-30) play(idx-1);
});

// Volume toggle
document.getElementById("volumeBtn").onclick=()=>{
  muted=!muted;
  volumeIcon.className = muted ? "fas fa-volume-mute" : "fas fa-volume-up";
  play(idx);
};

// Like animation
document.getElementById("likeBtn").onclick=()=>{
  likeCountEl.textContent = randomLikes();
  document.querySelector("#likeBtn i").className="fas fa-heart";
  setTimeout(()=>document.querySelector("#likeBtn i").className="far fa-heart",800);
};

// Share popup
document.getElementById("shareBtn").onclick=()=>{
  const box=document.getElementById("sharePopup");
  box.style.display = box.style.display==="flex"?"none":"flex";
};

// Sharing
document.getElementById("fbShare").onclick=()=>window.open("https://facebook.com/sharer/sharer.php?u="+encodeURIComponent(videos[idx]));
document.getElementById("twShare").onclick=()=>window.open("https://twitter.com/intent/tweet?url="+encodeURIComponent(videos[idx]));
document.getElementById("waShare").onclick=()=>window.open("https://api.whatsapp.com/send?text="+encodeURIComponent(videos[idx]));
document.getElementById("copyLink").onclick=()=>{navigator.clipboard.writeText(videos[idx]);alert("Copied!");};

// Sidebar
document.getElementById("hamburger").onclick=()=>document.getElementById("sidePanel").classList.toggle("open");
document.getElementById("refreshBtn").onclick=()=>location.reload();

// Register Service Worker (GitHub Pages safe)
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
