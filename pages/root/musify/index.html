<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TikTok Style Feed</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3046/3046127.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- 🧠 PWA Meta -->
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">

<style>
  :root {
    --primary: #ff0050;
    --bg: #000;
    --text: #fff;
    --shadow: rgba(0,0,0,0.6);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body,html { height:100%; overflow:hidden; background:var(--bg); font-family:'Segoe UI',sans-serif; color:var(--text); }

  /* Video Container */
  #videoContainer {
    position:absolute; top:0; left:0; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg, #1a1a1a, #000);
  }
  video { max-height:100vh; max-width:100vw; object-fit:contain; background:#000; }

  /* Volume Button */
  #volumeBtn {
    position:absolute; top:20px; right:20px;
    width:44px; height:44px;
    background:rgba(0,0,0,0.5);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; color:#fff;
    cursor:pointer; z-index:10;
    transition:all .2s;
    backdrop-filter:blur(8px);
  }
  #volumeBtn:active { transform:scale(0.9); }

  /* Info Panel */
  #infoPanel {
    position:absolute; bottom:80px; left:20px; right:80px;
    color:#fff; text-shadow:0 1px 3px var(--shadow);
    pointer-events:none;
  }
  #username { font-weight:700; font-size:18px; margin-bottom:4px; }
  #caption { font-size:14px; opacity:0.9; }

  /* Action Bar */
  #actionBar {
    position:absolute; right:15px; bottom:90px;
    display:flex; flex-direction:column; gap:20px;
    align-items:center; z-index:5;
  }
  .action-item { text-align:center; color:#fff; cursor:pointer; transition:transform .2s; }
  .action-item:active { transform:scale(1.3); }
  .action-icon {
    width:48px; height:48px; background:rgba(255,255,255,0.15);
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:24px; margin-bottom:6px; box-shadow:0 2px 8px var(--shadow);
  }
  .action-count { font-size:13px; font-weight:600; }

  /* Heart Animation */
  .heart-burst {
    position:absolute; pointer-events:none; font-size:60px;
    color:var(--primary); opacity:0; transform:scale(0);
    animation:heartPop 0.6s ease-out forwards; z-index:10;
  }
  @keyframes heartPop {
    0% { opacity:1; transform:scale(0) translateY(0); }
    50% { transform:scale(1.3); }
    100% { opacity:0; transform:scale(1) translateY(-100px); }
  }

  /* Hamburger Menu */
  #hamburger {
    position:fixed; top:20px; left:20px; font-size:28px;
    color:#fff; cursor:pointer; z-index:11;
  }
  #sidePanel {
    position:fixed; top:0; left:-250px; width:250px; height:100%;
    background:rgba(0,0,0,0.98); color:#fff;
    transition:left .3s; padding:70px 20px 20px; z-index:10;
  }
  #sidePanel.open { left:0; }
  .menu-item {
    padding:18px 0; font-size:18px; cursor:pointer;
    display:flex; align-items:center; gap:12px;
    border-bottom:1px solid #333;
  }
  .menu-item:hover { color:var(--primary); }

  /* Loader */
  #loader {
    position:fixed; inset:0; background:rgba(0,0,0,0.9);
    color:#fff; font-size:20px;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:10px; z-index:12;
  }
  .spinner {
    width:40px; height:40px; border:4px solid #333;
    border-top:4px solid var(--primary);
    border-radius:50%; animation:spin 1s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* Share Popup */
  #sharePopup {
    position:fixed; bottom:110px; right:75px;
    background:rgba(20,20,20,0.95); padding:15px;
    border-radius:12px; box-shadow:0 4px 12px var(--shadow);
    display:none; flex-direction:column; gap:10px; z-index:15;
  }
  .share-option {
    display:flex; align-items:center; gap:8px;
    color:#fff; cursor:pointer; font-size:15px;
  }
  .share-option i { width:20px; text-align:center; }
  .share-option:hover { color:var(--primary); }
</style>
</head>
<body>

<div id="hamburger"><i class="fas fa-bars"></i></div>

<nav id="sidePanel">
  <a class="menu-item" href="https://smile-wifi.github.io/Main" target="_blank">
    <i class="fas fa-home"></i> Home
  </a>
  <div class="menu-item" id="refreshBtn">
    <i class="fas fa-sync-alt"></i> Refresh
  </div>
</nav>

<div id="videoContainer">
  <video id="vid" autoplay playsinline></video>

  <div id="volumeBtn">
    <i class="fas fa-volume-mute" id="volumeIcon"></i>
  </div>
</div>

<div id="infoPanel">
  <div id="username">@user123</div>
  <div id="caption">Check out this amazing clip! #fyp #viral</div>
</div>

<div id="actionBar">
  <div class="action-item" id="likeBtn">
    <div class="action-icon"><i class="far fa-heart"></i></div>
    <div class="action-count" id="likeCount">12.4k</div>
  </div>
  <div class="action-item"><div class="action-icon"><i class="far fa-comment"></i></div><div class="action-count">342</div></div>
  <div class="action-item"><div class="action-icon"><i class="far fa-bookmark"></i></div><div class="action-count">89</div></div>
  <div class="action-item" id="shareBtn"><div class="action-icon"><i class="fas fa-share"></i></div><div class="action-count">Share</div></div>
</div>

<!-- Share Popup -->
<div id="sharePopup">
  <div class="share-option" id="fbShare"><i class="fab fa-facebook"></i> Facebook</div>
  <div class="share-option" id="twShare"><i class="fab fa-x-twitter"></i> Twitter</div>
  <div class="share-option" id="waShare"><i class="fab fa-whatsapp"></i> WhatsApp</div>
  <div class="share-option" id="copyLink"><i class="fas fa-link"></i> Copy Link</div>
</div>

<div id="loader">
  <div class="spinner"></div>
  <div>Loading videos...</div>
</div>

<script>
const REPO = 'Smile-Wifi/musify-auto';
const BRANCH = 'main';
const VIDEO_EXT = ['.mp4','.webm','.mov'];

const videoEl = document.getElementById('vid');
const container = document.getElementById('videoContainer');
const loader = document.getElementById('loader');
const sidePanel = document.getElementById('sidePanel');
const hamburger = document.getElementById('hamburger');
const usernameEl = document.getElementById('username');
const likeCountEl = document.getElementById('likeCount');
const likeBtn = document.getElementById('likeBtn');
const volumeBtn = document.getElementById('volumeBtn');
const volumeIcon = document.getElementById('volumeIcon');
const sharePopup = document.getElementById('sharePopup');
const shareBtn = document.getElementById('shareBtn');

let videos=[], idx=0, isMuted=true;

/* Random Data */
const usernames=['coolvibes','danceking','funnycat','travelpro','foodie','gamerlife','artistic','musiclover','fitnessguru','dreamer'];
const captions=[
  'This is fire! #fyp #viral','Wait for it... #funny #lol','POV: You try this #challenge',
  'Life hack you need! #tips','Morning routine #aesthetic','Just vibing #music #dance',
  'Unbelievable! #wow','Tag a friend #friends'
];

function randomUsername(){return '@'+usernames[Math.floor(Math.random()*usernames.length)]+Math.floor(Math.random()*999);}
function randomLikes(){
  const n=Math.random();
  if(n>0.9)return (Math.floor(Math.random()*900)+100)+'k';
  if(n>0.7)return Math.floor(Math.random()*90)+10+'.'+Math.floor(Math.random()*9)+'k';
  return Math.floor(Math.random()*900)+100;
}

function ghRaw(path){return `https://raw.githubusercontent.com/${REPO}/${BRANCH}/${path}`;}

async function loadVideoList(){
  try{
    const res=await fetch(ghRaw('videos.json'));
    if(!res.ok)throw new Error();
    const list=await res.json();
    videos=list.filter(f=>VIDEO_EXT.some(ext=>f.toLowerCase().endsWith(ext)))
      .map(f=>({url:ghRaw(f),name:f.split('/').pop()}));
  }catch{
    console.warn('No videos.json, crawling repo...');
    videos=await crawlRepoTree('');
  }
  if(!videos.length)return alert('No videos found!');
  loader.style.display='none';
  playIdx(0);
}

async function crawlRepoTree(path){
  const res=await fetch(`https://api.github.com/repos/${REPO}/contents/${path}?ref=${BRANCH}`);
  if(!res.ok)throw new Error('GitHub API error');
  const items=await res.json();
  let found=[];
  for(const it of items){
    if(it.type==='file'&&VIDEO_EXT.some(ext=>it.name.toLowerCase().endsWith(ext))){
      found.push({url:it.download_url,name:it.name});
    }else if(it.type==='dir'){
      found.push(...await crawlRepoTree(it.path));
    }
  }
  return found;
}

function playIdx(i){
  if(i<0)i=videos.length-1;
  if(i>=videos.length)i=0;
  idx=i;
  const v=videos[idx];
  videoEl.src=v.url;
  videoEl.muted=isMuted;
  videoEl.load();
  videoEl.play().catch(()=>{});
  usernameEl.textContent=randomUsername();
  likeCountEl.textContent=randomLikes();
  document.getElementById('caption').textContent=captions[Math.floor(Math.random()*captions.length)];
  updateVolumeIcon();
}

function toggleMute(){isMuted=!isMuted;videoEl.muted=isMuted;updateVolumeIcon();}
function updateVolumeIcon(){volumeIcon.className=isMuted?'fas fa-volume-mute':'fas fa-volume-up';}
volumeBtn.addEventListener('click',e=>{e.stopPropagation();toggleMute();});

let tapCount=0;
container.addEventListener('click',e=>{
  if(e.target.closest('#volumeBtn'))return;
  tapCount++;setTimeout(()=>tapCount=0,300);
  if(tapCount===2)likeVideo(e);
});
function likeVideo(e){
  const heart=document.createElement('div');
  heart.className='heart-burst';
  heart.innerHTML='<i class="fas fa-heart"></i>';
  const rect=container.getBoundingClientRect();
  heart.style.left=(e.clientX-rect.left-30)+'px';
  heart.style.top=(e.clientY-rect.top-30)+'px';
  container.appendChild(heart);
  setTimeout(()=>heart.remove(),700);
  const current=parseFloat(likeCountEl.textContent.replace('k',''))||0;
  likeCountEl.textContent=(current+0.1).toFixed(1)+'k';
  likeBtn.querySelector('i').className='fas fa-heart';
  setTimeout(()=>likeBtn.querySelector('i').className='far fa-heart',1000);
}

likeBtn.addEventListener('click',()=>{
  const current=parseFloat(likeCountEl.textContent.replace('k',''))||0;
  likeCountEl.textContent=(current+0.1).toFixed(1)+'k';
  likeBtn.querySelector('i').className='fas fa-heart';
  setTimeout(()=>likeBtn.querySelector('i').className='far fa-heart',1000);
});

let touchStartY=0;const minSwipe=80;
container.addEventListener('touchstart',e=>{touchStartY=e.changedTouches[0].screenY;},{passive:true});
container.addEventListener('touchend',e=>{
  const delta=touchStartY-e.changedTouches[0].screenY;
  if(Math.abs(delta)<minSwipe)return;
  playIdx(idx+(delta>0?1:-1));
},{passive:true});
container.addEventListener('wheel',e=>{
  if(e.deltaY>30)playIdx(idx+1);
  else if(e.deltaY<-30)playIdx(idx-1);
},{passive:true});

videoEl.addEventListener('ended',()=>playIdx(idx+1));

hamburger.onclick=()=>sidePanel.classList.toggle('open');
document.getElementById('refreshBtn').onclick=()=>{
  sidePanel.classList.remove('open');
  loader.style.display='flex';
  videos=[];idx=0;
  loadVideoList();
};

loadVideoList();

/* 📦 Register Service Worker */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js')
      .then(()=>console.log('Service Worker registered'))
      .catch(err=>console.warn('SW failed',err));
  });
}

/* 🌍 Share Options */
shareBtn.addEventListener('click',()=>{
  sharePopup.style.display = sharePopup.style.display === 'flex' ? 'none' : 'flex';
});

/* Facebook Share */
document.getElementById('fbShare').addEventListener('click',()=>{
  const v=videos[idx]; const u=encodeURIComponent(v.url);
  window.open(`https://www.facebook.com/sharer/sharer.php?u=${u}`,'_blank','width=600,height=500');
});

/* Twitter Share */
document.getElementById('twShare').addEventListener('click',()=>{
  const v=videos[idx]; const u=encodeURIComponent(v.url);
  window.open(`https://twitter.com/intent/tweet?url=${u}&text=Check%20out%20this%20video!`,'_blank','width=600,height=500');
});

/* WhatsApp Share */
document.getElementById('waShare').addEventListener('click',()=>{
  const v=videos[idx]; const u=encodeURIComponent(v.url);
  window.open(`https://api.whatsapp.com/send?text=Check%20out%20this%20video!%20${u}`,'_blank');
});

/* Copy Link */
document.getElementById('copyLink').addEventListener('click',()=>{
  const v=videos[idx];
  navigator.clipboard.writeText(v.url).then(()=>{
    alert('Video link copied!');
  });
  sharePopup.style.display='none';
});
</script>
</body>
</html>
