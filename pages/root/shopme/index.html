<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - Online Marketplace</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

<body>
    <!-- Mobile Header -->
    <header class="mobile-header">
        <div class="header-left">
            <button class="hamburger-btn" id="hamburgerBtn">
                <i class="fas fa-bars"></i>
            </button>
        </div>
        
        <div class="logo">
            <h1>Smile Wifi</h1>
        </div>
        
        <div class="header-right">
            <button class="search-btn-mobile" id="searchBtnMobile">
                <i class="fas fa-search"></i>
            </button>
            <div class="cart-icon">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-count">0</span>
            </div>
        </div>
    </header>

    <!-- Side Panel -->
    <nav class="side-panel" id="sidePanel">
        <div class="side-panel-header">
            <div class="user-info">
                <div class="user-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="user-details">
                    <p class="user-name" id="userName">Guest User</p>
                    <p class="user-status">Welcome</p>
                </div>
            </div>
            <button class="close-btn" id="closeSidePanel">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <ul class="side-panel-menu">
            <li><a href="https://smile-wifi.github.io/Main"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="#" id="categoriesBtn"><i class="fas fa-th-large"></i> Categories</a></li>
            <li><a href="#" id="dealsBtn"><i class="fas fa-tag"></i> Today's Deals</a></li>
            <li><a href="dashboard.html" id="dashboardLink"><i class="fas fa-tachometer-alt"></i> Seller Dashboard</a></li>
            <li><a href="#" id="ordersBtn"><i class="fas fa-box"></i> My Orders</a></li>
            <li><a href="#" id="wishlistBtn"><i class="fas fa-heart"></i> Wishlist</a></li>
            <li><a href="login.html" id="authLink"><i class="fas fa-sign-in-alt"></i> Login</a></li>
        </ul>
    </nav>

    <!-- Overlay -->
    <div class="overlay" id="overlay"></div>

    <!-- Search Bar -->
    <div class="search-container" id="searchContainer">
        <div class="search-bar">
            <input type="text" placeholder="Search for products, brands, and more..." id="searchInput">
            <button class="search-btn" id="searchBtn">
                <i class="fas fa-search"></i>
            </button>
        </div>
